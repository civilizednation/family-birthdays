<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리 가족 생일 알림이 🎂</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ff6b6b">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./android-chrome-512x512.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="생일 알림">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
</head>

<body class="bg-blue-50 min-h-screen p-4 font-sans text-gray-800">

    <div class="max-w-md mx-auto shadow-lg overflow-hidden rounded-2xl">
        <div class="bg-blue-500 text-white p-6 text-center rounded-t-2xl">
            <h1 class="text-2xl font-bold mb-2">우리 가족 일정 알림이 🎂</h1>
            <p class="text-blue-100 text-sm">중요한 날, 며칠 남았을까?</p>
        </div>

        <div class="p-6 bg-gray-50 min-h-[300px]">
            <h2 class="text-lg font-bold text-gray-700 mb-4">다가오는 일정 목록</h2>
            <div id="birthdayList" class="space-y-3">
                <p class="text-center text-gray-400 text-sm py-4">데이터를 불러오는 중입니다...</p>
            </div>
        </div>

        <div class="p-6 bg-white border-t border-gray-200 rounded-b-2xl">
            <h2 class="text-sm font-bold text-gray-500 mb-4">새로운 일정 추가하기</h2>
            <div class="flex flex-col space-y-3">

                <input type="text" id="nameInput" placeholder="이름 또는 일정 (예: 아내 생일, 문성현 전역)"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

                <div class="flex space-x-2 items-center">
                    <input type="date" id="dateInput"
                        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <label
                        class="flex items-center space-x-2 text-sm font-medium text-gray-600 bg-gray-100 px-3 py-2 rounded-lg cursor-pointer">
                        <input type="checkbox" id="isLunar" class="w-4 h-4 text-blue-500 rounded focus:ring-blue-400">
                        <span>음력</span>
                    </label>
                </div>

                <!-- 반복 여부 선택 -->
                <div class="flex rounded-lg overflow-hidden border border-gray-300">
                    <button id="btnYearly" onclick="setRepeat(true)"
                        class="flex-1 py-2 text-sm font-medium bg-blue-500 text-white transition">
                        🔁 매년 반복
                    </button>
                    <button id="btnOnce" onclick="setRepeat(false)"
                        class="flex-1 py-2 text-sm font-medium bg-white text-gray-500 transition">
                        📅 일회성
                    </button>
                </div>

                <button id="addBtn"
                    class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                    등록하기 ➕
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTwOAC_LrrKH8CKepUOTf0pyd9qRv4y_8",
            authDomain: "cnation-project.firebaseapp.com",
            projectId: "cnation-project",
            storageBucket: "cnation-project.firebasestorage.app",
            messagingSenderId: "1004154104261",
            appId: "1:1004154104261:web:0eac4c7ded38262ae5c3ac",
            measurementId: "G-7PW1NSP5EQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const collectionName = "cnation-family-birthdays";

        // 반복 여부 상태
        let isYearly = true;

        window.setRepeat = function(yearly) {
            isYearly = yearly;
            const btnYearly = document.getElementById('btnYearly');
            const btnOnce = document.getElementById('btnOnce');
            if (yearly) {
                btnYearly.className = 'flex-1 py-2 text-sm font-medium bg-blue-500 text-white transition';
                btnOnce.className = 'flex-1 py-2 text-sm font-medium bg-white text-gray-500 transition';
            } else {
                btnYearly.className = 'flex-1 py-2 text-sm font-medium bg-white text-gray-500 transition';
                btnOnce.className = 'flex-1 py-2 text-sm font-medium bg-blue-500 text-white transition';
            }
        };

        function getSolarDate(year, month, day, isLunar) {
            if (isLunar) {
                const lunarDate = Lunar.fromYmd(year, month, day);
                const s = lunarDate.getSolar();
                return new Date(s.getYear(), s.getMonth() - 1, s.getDay());
            }
            return new Date(year, month - 1, day);
        }

        function formatDate(d) {
            return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
        }

        function calculateEventInfo(birthDateStr, isLunar, yearly) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const [origYear, origMonth, origDay] = birthDateStr.split('-').map(Number);
            const currentYear = today.getFullYear();

            let targetDate;

            if (yearly) {
                // 매년 반복: 올해 날짜 계산 후 지났으면 내년으로
                targetDate = getSolarDate(currentYear, origMonth, origDay, isLunar);
                if (targetDate < today) {
                    targetDate = getSolarDate(currentYear + 1, origMonth, origDay, isLunar);
                }
            } else {
                // 일회성: 원래 연도 그대로 사용
                targetDate = getSolarDate(origYear, origMonth, origDay, isLunar);
            }

            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            let dDayText = "";
            let textColorClass = "";
            let opacityClass = "opacity-100";

            if (diffDays === 0) {
                dDayText = "D-Day 🎉";
                textColorClass = "text-red-500 font-bold";
            } else if (diffDays > 0) {
                dDayText = `D-${diffDays}`;
                textColorClass = "text-blue-600 font-bold";
            } else {
                // 일회성이고 이미 지난 경우
                dDayText = `D+${Math.abs(diffDays)}`;
                textColorClass = "text-gray-400";
                opacityClass = "opacity-50";
            }

            const displayDate = formatDate(targetDate);

            // 음력인 경우, 원래 등록된 날짜(원년도 기준)의 양력 변환 날짜도 계산
            // "날짜:" 줄에 음력 원본 대신 양력 변환 날짜 + (양력) 표시를 위해 사용
            let originalSolarDisplay = null;
            if (isLunar) {
                const origSolarDate = getSolarDate(origYear, origMonth, origDay, true);
                originalSolarDisplay = formatDate(origSolarDate);
            }

            return { dDayText, textColorClass, displayDate, diffDays, opacityClass, originalSolarDisplay };
        }

        document.getElementById('addBtn').addEventListener('click', async () => {
            const name = document.getElementById('nameInput').value.trim();
            const date = document.getElementById('dateInput').value;
            const isLunar = document.getElementById('isLunar').checked;

            if (!name || !date) {
                alert('이름과 날짜를 모두 입력해주세요!');
                return;
            }

            await addDoc(collection(db, collectionName), {
                name: name,
                birthDate: date,
                isLunar: isLunar,
                yearly: isYearly
            });

            document.getElementById('nameInput').value = '';
            document.getElementById('dateInput').value = '';
            document.getElementById('isLunar').checked = false;
            setRepeat(true); // 기본값으로 리셋
        });

        onSnapshot(collection(db, collectionName), (snapshot) => {
            const listDiv = document.getElementById('birthdayList');
            listDiv.innerHTML = '';

            if (snapshot.empty) {
                listDiv.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">등록된 일정이 없습니다. 아래에서 추가해 보세요!</p>';
                return;
            }

            let events = [];
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                // yearly 필드가 없는 기존 데이터는 매년 반복으로 처리
                const yearly = data.yearly !== undefined ? data.yearly : true;
                const info = calculateEventInfo(data.birthDate, data.isLunar, yearly);
                events.push({ id: docSnap.id, data: { ...data, yearly }, info });
            });

            // 정렬: 앞으로 남은 것 오름차순 → 지난 것 (최근 지난 것 먼저)
            events.sort((a, b) => {
                const isAFuture = a.info.diffDays >= 0;
                const isBFuture = b.info.diffDays >= 0;
                if (isAFuture && isBFuture) return a.info.diffDays - b.info.diffDays;
                if (!isAFuture && !isBFuture) return b.info.diffDays - a.info.diffDays;
                return isAFuture ? -1 : 1;
            });

            events.forEach((item) => {
                const { id, data, info } = item;

                const lunarTag = data.isLunar
                    ? '<span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-1 rounded-full ml-2">음력</span>'
                    : '<span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-full ml-2">양력</span>';

                const repeatTag = data.yearly
                    ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full ml-1">매년</span>'
                    : '<span class="text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded-full ml-1">일회</span>';

                // 음력인 경우 원본 날짜 줄을 양력 변환 날짜 + (양력) 표시로 대체
                const baseDateDisplay = data.isLunar
                    ? `${info.originalSolarDisplay} (양력)`
                    : data.birthDate;

                const itemHtml = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center transition hover:shadow-md ${info.opacityClass}">
                        <div>
                            <div class="flex items-center flex-wrap mb-1">
                                <span class="font-bold text-gray-800 text-lg">${data.name}</span>
                                ${lunarTag}
                                ${repeatTag}
                            </div>
                            <div class="text-xs text-gray-500">
                                날짜: ${baseDateDisplay} <br>
                                ${data.yearly ? '다음' : '예정'}: ${info.displayDate}
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-xl ${info.textColorClass}">${info.dDayText}</span>
                            <button onclick="deleteEvent('${id}')" class="mt-2 text-xs text-red-400 hover:text-red-600 underline">삭제</button>
                        </div>
                    </div>
                `;
                listDiv.innerHTML += itemHtml;
            });
        });

        window.deleteEvent = async (id) => {
            if (confirm("이 일정을 삭제하시겠습니까?")) {
                await deleteDoc(doc(db, collectionName, id));
            }
        };
    </script>
</body>

</html>
